[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ahash = "0.8"
arrow = "56"
parquet = { version = "56", default-features = false, features = ["arrow", "snap"] }
rayon = "1"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
debug = false
