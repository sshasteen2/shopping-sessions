[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ahash = "0.8"
hashbrown = { version = "0.16", default-features = false }
memchr = "2"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }
parquet = { version = "56", default-features = false }
rayon = "1"
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
debug = false
